name: Training configuration and resume checks
on:
  pull_request:
  push:
    branches: [main, training-only-configs]

jobs:
  training-tests:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"
      - name: Install locked environment
        run: uv sync --frozen --python 3.11
      - name: Check formatting, configuration, regression and packaging
        run: bash scripts/check_training.sh
